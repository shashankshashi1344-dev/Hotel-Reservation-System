
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Grand Stay</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        header {
            background: #176b55;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        header h1 { margin-top: 0; }

        .top-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 11px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            background: #176b55;
        }

        .home-button { background: #475569; }

        .success, .error {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 16px #0000000d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e8f3ef;
            color: #176b55;
        }

        tr:hover { background: #f8faf9; }

        .edit-button, .delete-button {
            display: inline-block;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-button { background: #176b55; }
        .delete-button { background: #dc2626; }

        .action-form { display: inline; }

        .empty-message {
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <h1>Room Management</h1>
        <p>Manage hotel rooms, prices, facilities, and availability.</p>
    </header>

    <div class="top-actions">
        <a class="button" href="/admin/rooms/new">+ Add New Room</a>
        <a class="button home-button" href="/dashboard">← Back to Dashboard</a>
    </div>

    <div class="success" th:if="${successMessage}"
         th:text="${successMessage}"></div>

    <div class="error" th:if="${errorMessage}"
         th:text="${errorMessage}"></div>

    <div class="table-container">
        <h2>All Hotel Rooms</h2>

        <table>
            <thead>
            <tr>
                <th>Room ID</th>
                <th>Room Number</th>
                <th>Room Type</th>
                <th>Price / Night (₹)</th>
                <th>Capacity</th>
                <th>Facilities</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="room : ${rooms}">
                <td th:text="${room.roomId}"></td>
                <td th:text="${room.roomNumber}"></td>
                <td th:text="${room.roomType}"></td>
                <td th:text="${room.pricePerNight}"></td>
                <td th:text="${room.capacity}"></td>
                <td th:text="${room.facilities}"></td>
                <td th:text="${room.roomStatus}"></td>

                <td>
                    <a class="edit-button"
                       th:href="@{/admin/rooms/edit/{id}(id=${room.roomId})}">
                        Edit
                    </a>

                    <form class="action-form"
                          th:action="@{/admin/rooms/delete}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this room?');">

                        <input type="hidden" name="roomId"
                               th:value="${room.roomId}">

                        <button type="submit" class="delete-button">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(rooms)}">
                <td colspan="8" class="empty-message">
                    No rooms found. Click Add New Room to create one.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
