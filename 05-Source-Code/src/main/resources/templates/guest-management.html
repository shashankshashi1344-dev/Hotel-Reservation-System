
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3a5f;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1e3a5f;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f5f9;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Guest Management</h1>
    <p>View all registered hotel guests.</p>

    
    <div style="margin: 20px 0;">
        <input
            type="text"
            id="guestSearch"
            placeholder="Search by guest name or email..."
            onkeyup="searchGuests()"
            style="width:100%; padding:12px; border:1px solid #ccc;
                border-radius:6px; font-size:16px;">
    </div>

    <table>
        <thead>
        <tr>
            <th>Guest ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="guest : ${guests}">
            <td th:text="${guest.guestId}"></td>
            <td th:text="${guest.fullName}"></td>
            <td th:text="${guest.email}"></td>
            <td th:text="${guest.phone}"></td>
            <td th:text="${guest.address != null ? guest.address : 'Not provided'}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(guests)}">
            <td colspan="5" class="empty-message">
                No guests registered yet.
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/dashboard" class="back-button">Back to Dashboard</a>

</div>
</body>

<script>
    function searchGuests() {
        const input = document.getElementById("guestSearch");
        const filter = input.value.toLowerCase();
        const table = document.querySelector("table");
        const rows = table.querySelectorAll("tbody tr");

        rows.forEach(function(row) {
            const nameCell = row.cells[1];
            const emailCell = row.cells[2];

            if (!nameCell || !emailCell) {
                return;
            }

            const name = nameCell.textContent.toLowerCase();
            const email = emailCell.textContent.toLowerCase();

            if (name.includes(filter) || email.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }
</script>

</html>
